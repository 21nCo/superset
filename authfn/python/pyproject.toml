[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authfn"
version = "0.0.1"
description = "API key authentication library using Superfunctions abstractions for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["auth", "authentication", "api-keys", "superfunctions"]
authors = [
  { name = "21n" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.5.0",
  "cryptography>=41.0.0",
  "idna>=3.4",
  "superfunctions>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "mypy>=1.7.0",
  "ruff>=0.1.6",
  "black>=23.11.0",
  "fastapi>=0.104.0",
  "flask>=3.0.0",
  "httpx>=0.27.0",
]
fastapi = [
  "fastapi>=0.104.0",
]
flask = [
  "flask>=3.0.0",
]

[project.urls]
Documentation = "https://docs.superfunctions.dev/authfn"
Repository = "https://github.com/21nCo/super-functions"
Issues = "https://github.com/21nCo/super-functions/issues"

[tool.hatch.build.targets.wheel]
packages = ["authfn"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests", "tests_smoke"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = '^(build|dist|tests|examples)(/|$)|^setup\.py$'

[[tool.mypy.overrides]]
module = [
  "superfunctions.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["authfn.http"]
disable_error_code = ["arg-type", "call-arg", "index", "no-any-return", "union-attr"]

[[tool.mypy.overrides]]
module = [
  "authfn.plugins.api_keys",
  "authfn.plugins.email_otp",
  "authfn.plugins.multi_region",
  "authfn.plugins.social_oauth",
  "authfn.plugins.two_factor",
]
disable_error_code = ["arg-type", "assignment", "call-arg", "dict-item", "no-any-return"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
]
ignore = [
  "E501", # line too long, handled by black
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
