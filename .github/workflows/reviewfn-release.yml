name: ReviewFn release gate

on:
  pull_request:
    branches: [dev]
    paths:
      - "reviewfn/**"
      - "scripts/gate-reviewfn-release.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/reviewfn-release.yml"
  push:
    branches: [dev]
    paths:
      - "reviewfn/**"
      - "scripts/gate-reviewfn-release.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewfn-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run gate:reviewfn-release
